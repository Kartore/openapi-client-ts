packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  '@tanstack/query-core': ^5.104.5
  '@tanstack/react-query': ^5.104.5
  '@tanstack/svelte-query': ^6.3.5
  '@types/node': ^26.6.5
  '@vitest/coverage-v8': 5.0.5
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5

overrides:
  'vite@*': 'catalog:'
  'vitest@*': 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
    - '@vitest/coverage-v8'
  allowedVersions:
    vite: '*'
    vitest: '*'

minimumReleaseAge: 10080
strictDepBuilds: true
trustPolicy: no-downgrade
